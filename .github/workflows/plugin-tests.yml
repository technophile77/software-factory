name: plugin-tests
# The plugin's skill tests (H-0148). onboard-repo's run in the pinned tool
# environment its own setup_tools.py builds (ADR 0020).
on:
  pull_request:
    paths: ["plugins/**", "engine/config/limits.yaml", ".github/workflows/plugin-tests.yml"]
  push:
    branches: [main]
    paths: ["plugins/**", "engine/config/limits.yaml", ".github/workflows/plugin-tests.yml"]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  onboard-repo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: plugins/software-factory/skills/onboard-repo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Tests make throwaway repos and commit in them.
      - run: |
          git config --global user.name "plugin-tests"
          git config --global user.email "plugin-tests@example.invalid"
      - run: |
          python3 -I scripts/setup_tools.py --home "$RUNNER_TEMP/sf-tools" > "$RUNNER_TEMP/tools-python"
          "$(cat "$RUNNER_TEMP/tools-python")" -m unittest discover -s tests
