name: engine
# The engine's tests also read these files from the repo root, so a change to
# one of them must run the tests too (H-0130).
on:
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/engine.yml"
      - "agents/requirements-analyst/**"
      - "agents/web-reader/**"
      - "agents/security-reviewer/**"
      - "skills/security-review/**"
      - "docs/security-standards.md"
      - "plugins/software-factory/skills/onboard-repo/templates/factory-project.yaml"
      - ".gitignore"
      - "scripts/osv_fixable.py"
  push:
    branches: [main]
    paths:
      - "engine/**"
      - ".github/workflows/engine.yml"
      - "agents/requirements-analyst/**"
      - "agents/web-reader/**"
      - "agents/security-reviewer/**"
      - "skills/security-review/**"
      - "docs/security-standards.md"
      - "plugins/software-factory/skills/onboard-repo/templates/factory-project.yaml"
      - ".gitignore"
      - "scripts/osv_fixable.py"
  # Nightly: a CVE published after a merge is still found (S4.4), and the
  # full suite runs on Windows and macOS, which PRs only sample (H-0153).
  schedule:
    - cron: "0 6 * * *"
permissions:
  contents: read
# A newer push to a PR makes its older run moot, so that run stops and frees
# its runners (H-0130). Runs on main and the nightly run each get their own
# group, so none of them is ever cancelled or held back.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('engine-pr-{0}', github.event.pull_request.number) || format('engine-{0}', github.run_id) }}
  cancel-in-progress: true
jobs:
  # Checks whose result doesn't depend on the OS run once (H-0130).
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci --ignore-scripts
      # All dependencies, dev tools included (S4.4).
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build

  test:
    name: test (${{ matrix.os }}, ${{ matrix.scope }} ${{ matrix.shard }})
    strategy:
      fail-fast: false
      # The engine has platform code (named pipe ACL, peer checks, credential
      # store) that only runs on its own OS. Each shard runs every test file
      # but only its share of each file's tests (engine/test/shard.ts), so a
      # long file no longer sets the floor; slower runners get more shards
      # (H-0130). Workers: these tests mostly wait on git, so Linux takes
      # more than its cores, but on Windows 6 workers made single tests 2-3x
      # slower and some timed out, so Windows keeps Vitest's default of 3.
      #
      # On PRs, Linux runs the full suite and macOS and Windows run only the
      # files that exercise platform code (`npm run test:platform`); pushes
      # to main and the nightly run test everything on all three (owner
      # decision 2026-11-13, H-0153). The two matrices, as JSON:
      matrix: >-
        ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[
        {"os": "ubuntu-latest", "shard": "1/2", "workers": 6, "scope": "full"},
        {"os": "ubuntu-latest", "shard": "2/2", "workers": 6, "scope": "full"},
        {"os": "macos-latest", "shard": "1/1", "workers": 4, "scope": "platform"},
        {"os": "windows-latest", "shard": "1/2", "workers": 3, "scope": "platform"},
        {"os": "windows-latest", "shard": "2/2", "workers": 3, "scope": "platform"}
        ]}'
        || '{"include":[
        {"os": "ubuntu-latest", "shard": "1/2", "workers": 6, "scope": "full"},
        {"os": "ubuntu-latest", "shard": "2/2", "workers": 6, "scope": "full"},
        {"os": "macos-latest", "shard": "1/3", "workers": 4, "scope": "full"},
        {"os": "macos-latest", "shard": "2/3", "workers": 4, "scope": "full"},
        {"os": "macos-latest", "shard": "3/3", "workers": 4, "scope": "full"},
        {"os": "windows-latest", "shard": "1/6", "workers": 3, "scope": "full"},
        {"os": "windows-latest", "shard": "2/6", "workers": 3, "scope": "full"},
        {"os": "windows-latest", "shard": "3/6", "workers": 3, "scope": "full"},
        {"os": "windows-latest", "shard": "4/6", "workers": 3, "scope": "full"},
        {"os": "windows-latest", "shard": "5/6", "workers": 3, "scope": "full"},
        {"os": "windows-latest", "shard": "6/6", "workers": 3, "scope": "full"}
        ]}') }}
    runs-on: ${{ matrix.os }}
    # A Windows run hung for 54 minutes once (H-0086); a shard takes about 7.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci --ignore-scripts
      # Matrix values reach the command through env vars, not template
      # expansion: the matrix comes from fromJSON, so zizmor can't prove the
      # values are constant. Bash so the same line works on Windows.
      - run: npm run "$TEST_SCRIPT" -- --maxWorkers="$TEST_WORKERS"
        shell: bash
        env:
          FACTORY_TEST_SHARD: ${{ matrix.shard }}
          TEST_SCRIPT: ${{ matrix.scope == 'platform' && 'test:platform' || 'test' }}
          TEST_WORKERS: ${{ matrix.workers }}

  # SR-19 (H-0088): known CVEs in both lockfiles and in the agent image.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The release binary, not osv-scanner-action, whose container image is
      # pinned only by tag (Gate 1 report, review 7).
      - name: Install OSV-Scanner 2.7.1
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" \
            https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/osv-scanner"
      - name: Scan the lockfiles
        run: >
          "$RUNNER_TEMP/osv-scanner" scan source --config engine/osv-scanner.toml
          -L engine/package-lock.json -L engine/docker/claude-code/package-lock.json
      # Built as the engine builds it, from the base image the engine pins.
      # Skills are text files the engine adds per project, so an empty folder
      # stands in for them; they add no packages to scan.
      - name: Build the agent image
        run: |
          ctx="$RUNNER_TEMP/agent-context"
          cp -R engine/docker "$ctx"
          mkdir -p "$ctx/skills"
          digest=$(sed -n 's/^export const BASE_IMAGE_DIGEST = "\(sha256:[0-9a-f]\{64\}\)";$/\1/p' engine/src/docker/image.ts)
          tag=$(sed -n 's/^export const BASE_IMAGE = `\(node:[^@`]*\)@\${BASE_IMAGE_DIGEST}`;$/\1/p' engine/src/docker/image.ts)
          test -n "$digest" && test -n "$tag"
          docker buildx build --load --build-arg "BASE_IMAGE=$tag@$digest" \
            --tag factory-agent:ci --file "$ctx/agent.Dockerfile" "$ctx"
      # Owner decision 2026-11-11: only a CVE with a fix fails the job;
      # unfixed base-image ones are listed. Exit 1 means "found some", so
      # anything above it is a scanner error and fails.
      - name: Scan the agent image
        run: |
          rc=0
          "$RUNNER_TEMP/osv-scanner" scan image --config engine/osv-scanner.toml \
            --format json --output-file "$RUNNER_TEMP/image-scan.json" factory-agent:ci || rc=$?
          test "$rc" -le 1
          python3 -I scripts/osv_fixable.py "$RUNNER_TEMP/image-scan.json"
      # F-013 SR-16 / FR-15: the LiteLLM image holds the endpoint keys, so it is
      # scanned like the agent image. It is pulled by the digest the engine
      # pins, read from the one-line LITELLM_PIN in the source so the two can't
      # drift apart. While the pin is null (SR-17: no 1.108.x release is 14 days
      # old yet) there is nothing to scan and both steps are skipped.
      - name: Pull the pinned LiteLLM image
        id: litellm
        run: |
          repo=$(sed -n 's/^export const LITELLM_IMAGE = "\(ghcr\.io\/[a-z0-9._\/-]*\)";$/\1/p' engine/src/docker/litellm-image.ts)
          test -n "$repo"
          if grep -q '^export const LITELLM_PIN: LitellmPin | null = null;$' engine/src/docker/litellm-image.ts; then
            echo "no LiteLLM pin set; scan skipped (SR-17, OQ-12)"
            echo "pinned=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          digest=$(sed -n 's/^export const LITELLM_PIN: LitellmPin | null = {.* digest: "\(sha256:[0-9a-f]\{64\}\)".*};$/\1/p' engine/src/docker/litellm-image.ts)
          test -n "$digest"
          docker pull "$repo@$digest"
          docker tag "$repo@$digest" factory-router:ci
          echo "pinned=true" >> "$GITHUB_OUTPUT"
      # Same rule as the agent image: only a CVE with a fix fails the job.
      - name: Scan the LiteLLM image
        if: steps.litellm.outputs.pinned == 'true'
        run: |
          rc=0
          "$RUNNER_TEMP/osv-scanner" scan image --config engine/osv-scanner.toml \
            --format json --output-file "$RUNNER_TEMP/router-scan.json" factory-router:ci || rc=$?
          test "$rc" -le 1
          python3 -I scripts/osv_fixable.py "$RUNNER_TEMP/router-scan.json"
