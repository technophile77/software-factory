name: engine
on:
  pull_request:
    paths: ["engine/**", ".github/workflows/engine.yml"]
  push:
    branches: [main]
    paths: ["engine/**", ".github/workflows/engine.yml"]
  # Weekly, so a CVE published after a merge is still found (S4.4).
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      # The engine has platform code (named pipe ACL, peer checks, credential
      # store) that only runs on its own OS.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A Windows run hung for 54 minutes once; a full run takes about 25 (H-0086).
    timeout-minutes: 45
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci --ignore-scripts
      # All dependencies, dev tools included (S4.4).
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
