name: engine
on:
  pull_request:
    paths: ["engine/**", ".github/workflows/engine.yml"]
  push:
    branches: [main]
    paths: ["engine/**", ".github/workflows/engine.yml"]
  # Weekly, so a CVE published after a merge is still found (S4.4).
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      # The engine has platform code (named pipe ACL, peer checks, credential
      # store) that only runs on its own OS.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A Windows run hung for 54 minutes once; a full run takes about 25 (H-0086).
    timeout-minutes: 45
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci --ignore-scripts
      # All dependencies, dev tools included (S4.4).
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # SR-19 (H-0088): known CVEs in both lockfiles and in the agent image.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The release binary, not osv-scanner-action, whose container image is
      # pinned only by tag (Gate 1 report, review 7).
      - name: Install OSV-Scanner 2.7.1
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" \
            https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/osv-scanner"
      - name: Scan the lockfiles
        run: >
          "$RUNNER_TEMP/osv-scanner" scan source --config engine/osv-scanner.toml
          -L engine/package-lock.json -L engine/docker/claude-code/package-lock.json
      # Built as the engine builds it, from the base image the engine pins.
      # Skills are text files the engine adds per project, so an empty folder
      # stands in for them; they add no packages to scan.
      - name: Build the agent image
        run: |
          ctx="$RUNNER_TEMP/agent-context"
          cp -R engine/docker "$ctx"
          mkdir -p "$ctx/skills"
          digest=$(sed -n 's/^export const BASE_IMAGE_DIGEST = "\(sha256:[0-9a-f]\{64\}\)";$/\1/p' engine/src/docker/image.ts)
          tag=$(sed -n 's/^export const BASE_IMAGE = `\(node:[^@`]*\)@\${BASE_IMAGE_DIGEST}`;$/\1/p' engine/src/docker/image.ts)
          test -n "$digest" && test -n "$tag"
          docker buildx build --load --build-arg "BASE_IMAGE=$tag@$digest" \
            --tag factory-agent:ci --file "$ctx/agent.Dockerfile" "$ctx"
      # Owner decision 2026-11-11: only a CVE with a fix fails the job;
      # unfixed base-image ones are listed. Exit 1 means "found some", so
      # anything above it is a scanner error and fails.
      - name: Scan the agent image
        run: |
          rc=0
          "$RUNNER_TEMP/osv-scanner" scan image --config engine/osv-scanner.toml \
            --format json --output-file "$RUNNER_TEMP/image-scan.json" factory-agent:ci || rc=$?
          test "$rc" -le 1
          python3 -I scripts/osv_fixable.py "$RUNNER_TEMP/image-scan.json"
