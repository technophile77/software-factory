schema: factory-project/1.0
name: <project-name>
description: <one line on what the project is>

factory:
  version: <tag or commit of the master factory>

enabled: false                # ADR 0012: work starts only when the owner switches this on

# Owner and authorization (Project manifest v1.3). The engine won't run the
# project until the owner fills these in with their own values. Placeholders
# only: real values belong in the project's config repo, never in the master
# factory repo.
# owner:
#   github_id: <numeric id>        # the only account whose device approval opens an interview
#   oauth_client_id: <client id>   # the owner's OAuth app, device flow, no scopes, no secret
# allowed_repo_owners:             # accounts whose repos this project may work on
#   - { login: <login>, id: <numeric id> }

# Session limits (Project manifest v1.4, H-0087). Optional. The defaults are in
# the master factory's engine/config/limits.yaml, with the same sections and
# keys. A project may only lower values: the engine takes the lower of the two,
# and refuses the project, with a Security item, if any value here is higher.
# limits:
#   analyst:
#     turns: 150
#     wall_time_minutes: 120
#   worktree_commit:
#     max_files: 100

repos:
  - name: <repo-name>
    url: https://github.com/<owner>/<repo>
    maturity: <level>       # the only record of this repo's level
    policy:                 # per-repo overrides: allow lists replace the project's, deny lists add to them
      roles:
        software-developer:
          write:
            allow: ["<SOURCE_GLOBS>", "docs/**"]
            deny: ["<TEST_GLOBS>"]
          commands:
            allow: [<BUILD_COMMANDS>, "git"]
          network:
            allow: [<REGISTRIES>]
        test-engineer:
          write:
            allow: ["<TEST_GLOBS>"]
          commands:
            allow: [<TEST_COMMANDS>]
          network:
            allow: [<REGISTRIES>]
        validation-judge:
          commands:
            allow: [<TEST_COMMANDS>]
maturity: <level>             # may not exceed the lowest repo's maturity

# complexity: <simple | moderate | complex>   # F-002 preset; add only once F-002 is merged
                                              # and the owner has approved the value

skills:
  custom: []
  override: []
  exclude: []

agents:
  custom: []
  override: []

standards: {}

settings:
  interview_sign_in:                # F-018 FR-15; pinned, a change needs `factory-engine confirm`
    every: <never | engine_start | session | hours>   # never only at rapid-prototype
    # hours: <1-168>                # only with every: hours

# Role policy (Role policy v2.3, from ADR 0004's table). Anything not allowed
# is denied; deny wins over allow; a role missing here may not run. `tools`
# are the agent's built-in tools; Bash runs only the `commands` listed. Loosening
# a rule is a Security decision. Fill placeholders per repo above; one you
# can't fill becomes an empty list, never a guess.
policy:
  roles:
    requirements-analyst:
      tools:
        allow: ["Read", "Grep", "Glob", "Edit", "Write", "Skill"]   # web only through web-reader
      read:
        allow: ["**"]
        deny: ["**/.env", "**/.env.*", "**/.envrc", "**/*.pem", "**/*.key", "**/*.p12", "**/*.pfx", "**/*.jks", "**/*.keystore", "**/id_rsa*", "**/id_dsa*", "**/id_ecdsa*", "**/id_ed25519*", "**/.npmrc", "**/.pypirc", "**/.netrc", "**/.git-credentials", "**/*.tfvars", "**/credentials*.json", "**/*.tfstate", "**/*.tfstate.*", "**/.aws/credentials", "**/.docker/config.json", "**/*.ppk", "**/kubeconfig", "**/.kube/config", ".factory/engine.json", "**/.factory/engine.json"]   # secret files (Role policy v2.2)
      write:
        allow: ["docs/features/**"]
        deny: ["CLAUDE.md", "**/CLAUDE.md", "CLAUDE.local.md", "**/CLAUDE.local.md", ".claude/**", ".mcp.json", ".github/**", ".gitignore", ".gitattributes", ".husky/**", ".pre-commit-config.yaml", "lefthook.yml", "osv-scanner.toml", "agents/**", "skills/**", "plugins/**", ".claude-plugin/**", "workflows/**", "**/.claude/**", ".envrc", "**/.envrc", ".git", ".git/**", ".gitmodules", ".vscode/**", ".devcontainer/**", "docs/features/*-source.md", "docs/features/*-source.txt"]
      commands:
        allow: []
      network:
        allow: []
    software-developer:
      tools:
        allow: ["Read", "Grep", "Glob", "Edit", "Write", "Bash"]
      read:
        allow: ["**"]
        deny: ["**/.env", "**/.env.*", "**/.envrc", "**/*.pem", "**/*.key", "**/*.p12", "**/*.pfx", "**/*.jks", "**/*.keystore", "**/id_rsa*", "**/id_dsa*", "**/id_ecdsa*", "**/id_ed25519*", "**/.npmrc", "**/.pypirc", "**/.netrc", "**/.git-credentials", "**/*.tfvars", "**/credentials*.json", "**/*.tfstate", "**/*.tfstate.*", "**/.aws/credentials", "**/.docker/config.json", "**/*.ppk", "**/kubeconfig", "**/.kube/config", ".factory/engine.json", "**/.factory/engine.json"]
      write:
        allow: []
        deny: ["docs/features/**", "CLAUDE.md", "**/CLAUDE.md", "CLAUDE.local.md", "**/CLAUDE.local.md", ".claude/**", ".mcp.json", ".github/**", ".gitignore", ".gitattributes", ".husky/**", ".pre-commit-config.yaml", "lefthook.yml", "osv-scanner.toml", "agents/**", "skills/**", "plugins/**", ".claude-plugin/**", "workflows/**", "**/.claude/**", ".envrc", "**/.envrc", ".git", ".git/**", ".gitmodules", ".vscode/**", ".devcontainer/**", "docs/features/*-source.md", "docs/features/*-source.txt"]
      commands:
        allow: []
      network:
        allow: []
    test-engineer:
      tools:
        allow: ["Read", "Grep", "Glob", "Edit", "Write", "Bash"]
      read:
        allow: ["**"]
        deny: ["**/.env", "**/.env.*", "**/.envrc", "**/*.pem", "**/*.key", "**/*.p12", "**/*.pfx", "**/*.jks", "**/*.keystore", "**/id_rsa*", "**/id_dsa*", "**/id_ecdsa*", "**/id_ed25519*", "**/.npmrc", "**/.pypirc", "**/.netrc", "**/.git-credentials", "**/*.tfvars", "**/credentials*.json", "**/*.tfstate", "**/*.tfstate.*", "**/.aws/credentials", "**/.docker/config.json", "**/*.ppk", "**/kubeconfig", "**/.kube/config", ".factory/engine.json", "**/.factory/engine.json"]
      write:
        allow: []
        deny: ["CLAUDE.md", "**/CLAUDE.md", "CLAUDE.local.md", "**/CLAUDE.local.md", ".claude/**", ".mcp.json", ".github/**", ".gitignore", ".gitattributes", ".husky/**", ".pre-commit-config.yaml", "lefthook.yml", "osv-scanner.toml", "agents/**", "skills/**", "plugins/**", ".claude-plugin/**", "workflows/**", "**/.claude/**", ".envrc", "**/.envrc", ".git", ".git/**", ".gitmodules", ".vscode/**", ".devcontainer/**", "docs/features/*-source.md", "docs/features/*-source.txt"]
      commands:
        allow: []
      network:
        allow: []
    security-reviewer:
      tools:
        allow: ["Read", "Grep", "Glob", "Write"]
      read:
        allow: ["**"]
        deny: ["**/.env", "**/.env.*", "**/.envrc", "**/*.pem", "**/*.key", "**/*.p12", "**/*.pfx", "**/*.jks", "**/*.keystore", "**/id_rsa*", "**/id_dsa*", "**/id_ecdsa*", "**/id_ed25519*", "**/.npmrc", "**/.pypirc", "**/.netrc", "**/.git-credentials", "**/*.tfvars", "**/credentials*.json", "**/*.tfstate", "**/*.tfstate.*", "**/.aws/credentials", "**/.docker/config.json", "**/*.ppk", "**/kubeconfig", "**/.kube/config", ".factory/engine.json", "**/.factory/engine.json"]
      write:
        allow: [".factory/runs/**/security-reviewer-*.json"]
      commands:
        allow: []
      network:
        allow: []
    validation-judge:
      tools:
        allow: ["Read", "Grep", "Glob", "Write", "Bash"]
      read:
        allow: ["**"]
        deny: ["**/.env", "**/.env.*", "**/.envrc", "**/*.pem", "**/*.key", "**/*.p12", "**/*.pfx", "**/*.jks", "**/*.keystore", "**/id_rsa*", "**/id_dsa*", "**/id_ecdsa*", "**/id_ed25519*", "**/.npmrc", "**/.pypirc", "**/.netrc", "**/.git-credentials", "**/*.tfvars", "**/credentials*.json", "**/*.tfstate", "**/*.tfstate.*", "**/.aws/credentials", "**/.docker/config.json", "**/*.ppk", "**/kubeconfig", "**/.kube/config", ".factory/engine.json", "**/.factory/engine.json"]
      write:
        allow: [".factory/runs/**/validation-judge-*.json"]
      commands:
        allow: []
      network:
        allow: []
    orchestrator:
      tools:
        allow: ["Read", "Grep", "Glob", "Edit", "Write", "Bash"]
      read:
        allow: ["**"]
        deny: ["**/.env", "**/.env.*", "**/.envrc", "**/*.pem", "**/*.key", "**/*.p12", "**/*.pfx", "**/*.jks", "**/*.keystore", "**/id_rsa*", "**/id_dsa*", "**/id_ecdsa*", "**/id_ed25519*", "**/.npmrc", "**/.pypirc", "**/.netrc", "**/.git-credentials", "**/*.tfvars", "**/credentials*.json", "**/*.tfstate", "**/*.tfstate.*", "**/.aws/credentials", "**/.docker/config.json", "**/*.ppk", "**/kubeconfig", "**/.kube/config", ".factory/engine.json", "**/.factory/engine.json"]
      write:
        allow: [".factory/inbox/**", ".factory/runs/**"]
      commands:
        allow: ["git", "gh"]
      network:
        allow: ["github.com", "api.github.com"]
    web-reader:                # reads web pages for the analyst; sees no project files
      tools:
        allow: ["fetch_page", "WebSearch"]   # fetch_page is the engine's stripped fetch (Role policy v2.5)
      read:
        allow: []
        deny: ["**/.env", "**/.env.*", "**/.envrc", "**/*.pem", "**/*.key", "**/*.p12", "**/*.pfx", "**/*.jks", "**/*.keystore", "**/id_rsa*", "**/id_dsa*", "**/id_ecdsa*", "**/id_ed25519*", "**/.npmrc", "**/.pypirc", "**/.netrc", "**/.git-credentials", "**/*.tfvars", "**/credentials*.json", "**/*.tfstate", "**/*.tfstate.*", "**/.aws/credentials", "**/.docker/config.json", "**/*.ppk", "**/kubeconfig", "**/.kube/config", ".factory/engine.json", "**/.factory/engine.json"]
      write:
        allow: []
      commands:
        allow: []
      network:
        allow: ["*"]           # any host: allowed only because this role has no file tools
    project-evaluator:         # advisory: rates complexity, writes only its report
      tools:
        allow: ["Read", "Grep", "Glob", "Write"]
      read:
        allow: ["**"]
        deny: ["**/.env", "**/.env.*", "**/.envrc", "**/*.pem", "**/*.key", "**/*.p12", "**/*.pfx", "**/*.jks", "**/*.keystore", "**/id_rsa*", "**/id_dsa*", "**/id_ecdsa*", "**/id_ed25519*", "**/.npmrc", "**/.pypirc", "**/.netrc", "**/.git-credentials", "**/*.tfvars", "**/credentials*.json", "**/*.tfstate", "**/*.tfstate.*", "**/.aws/credentials", "**/.docker/config.json", "**/*.ppk", "**/kubeconfig", "**/.kube/config", ".factory/engine.json", "**/.factory/engine.json", "calibration/**", "**/calibration/**", ".factory/tuning/**", "**/.factory/tuning/**", ".factory/runs/**/review.json", "**/.factory/runs/**/review.json"]   # secrets, and what scores it
      write:
        allow: [".factory/runs/**/project-evaluator-*.json"]
      commands:
        allow: []
      network:
        allow: []
    context-hygiene:           # reviews agent instructions; fixes go to the hygiene inbox
      tools:
        allow: ["Read", "Grep", "Glob", "Write"]
      read:
        allow: ["**"]
        deny: ["**/.env", "**/.env.*", "**/.envrc", "**/*.pem", "**/*.key", "**/*.p12", "**/*.pfx", "**/*.jks", "**/*.keystore", "**/id_rsa*", "**/id_dsa*", "**/id_ecdsa*", "**/id_ed25519*", "**/.npmrc", "**/.pypirc", "**/.netrc", "**/.git-credentials", "**/*.tfvars", "**/credentials*.json", "**/*.tfstate", "**/*.tfstate.*", "**/.aws/credentials", "**/.docker/config.json", "**/*.ppk", "**/kubeconfig", "**/.kube/config", ".factory/engine.json", "**/.factory/engine.json"]
      write:
        allow: [".factory/runs/**/context-hygiene-*.json"]
      commands:
        allow: []
      network:
        allow: []
    advisor:                   # advises the owner on one hard question; reads like the analyst, writes nothing
      may_request: ["requirements-analyst", "orchestrator"]   # the engine checks its own session, never a field
      tools:
        allow: ["Read", "Grep", "Glob", "Skill"]   # web only through web-reader; no shell until its own Security decision
      read:
        allow: ["**"]
        deny: ["**/.env", "**/.env.*", "**/.envrc", "**/*.pem", "**/*.key", "**/*.p12", "**/*.pfx", "**/*.jks", "**/*.keystore", "**/id_rsa*", "**/id_dsa*", "**/id_ecdsa*", "**/id_ed25519*", "**/.npmrc", "**/.pypirc", "**/.netrc", "**/.git-credentials", "**/*.tfvars", "**/credentials*.json", "**/*.tfstate", "**/*.tfstate.*", "**/.aws/credentials", "**/.docker/config.json", "**/*.ppk", "**/kubeconfig", "**/.kube/config", ".factory/engine.json", "**/.factory/engine.json", ".factory/**", "**/.factory/**"]   # nothing on factory/state: the engine supplies the current feature's transcript
      write:
        allow: []
      commands:
        allow: []
      network:
        allow: []

notes: |
  <project-specific context every agent reads>
